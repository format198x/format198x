name: Publish

# Publish a format crate to crates.io when release-plz tags its release.
#
# Auth is crates.io Trusted Publishing (OIDC) — no stored token. Each crate
# needs a trusted publisher configured once at crates.io (crate Settings ->
# Trusted Publishing): repository format198x/format198x, workflow "publish.yml",
# no environment.
#
# release-plz tags each crate independently as "<crate>-v<version>", so the tag
# names exactly which crate to publish. release-plz itself does not publish
# (publish = false); this workflow does, over OIDC, only for the tagged crate.

on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the short-lived crates.io token via OIDC

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Derive the crate + version from the tag, and check crates.io *before*
      # authenticating — an already-published version (a re-run, or a baseline
      # tag) then skips without even attempting OIDC, so it never depends on
      # Trusted Publishing being configured.
      - name: Resolve tag and check crates.io
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          crate="${tag%-v*}"      # strip the -v<version> suffix
          version="${tag##*-v}"   # keep only the version
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
          echo "channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "Tag $tag -> crate $crate, version $version"
          if curl -sf -A "198x-ci (steve@stevehill.xyz)" \
               "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
            echo "$crate $version already on crates.io — will skip."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.check.outputs.channel }}

      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.check.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish the tagged crate
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "${{ steps.check.outputs.crate }}"
