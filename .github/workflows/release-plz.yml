name: Release-plz

# Tags merged releases, then opens or updates the next release PR, using the
# workflow every 198x Rust repo shares (stevehill1981/198x-workflows). The
# manual dispatch republishes one already-tagged package to reconcile crates.io.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_package:
        description: "Publish one already-tagged package to reconcile crates.io"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # crates.io Trusted Publishing matches this file's name, so keep it, and keep
  # the reconcile job here rather than in a workflow of its own.
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    if: github.event_name == 'push'
    uses: stevehill1981/198x-workflows/.github/workflows/release-plz.yml@v1
    secrets: inherit
    with:
      announce: true

  reconcile-publish:
    name: Publish an already-tagged package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the requested package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "${{ inputs.publish_package }}"
