name: Release-plz

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

# No PAT: the default GITHUB_TOKEN drives everything. Opening the release PR
# needs the org/repo setting "Allow GitHub Actions to create and approve pull
# requests" enabled (Settings -> Actions -> General). id-token is for the OIDC
# publish below — no stored crates.io token.
permissions:
  pull-requests: write
  contents: write
  id-token: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Open/update the per-crate "chore: release" PR for new commits.
      - name: Run release-plz (open/update release PR)
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Once a release PR is merged, tag the released crate(s). publish = false
      # in release-plz.toml, so this only bumps/changelogs/tags — the publish
      # step below does crates.io over OIDC.
      - name: Run release-plz (tag merged releases)
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish whatever was just released to crates.io over Trusted Publishing.
      # Gated on releases_created, so the OIDC exchange happens only on an actual
      # release — never on an ordinary push, and never needing a stored token.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.release.outputs.releases_created == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish released crates
        if: steps.release.outputs.releases_created == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run (e.g. after a partial failure where one crate
          # published and another errored) must not fail on the crate already
          # on crates.io. Check each version before publishing and skip the ones
          # that are already there. Matches build198x's check-before-publish.
          echo "$RELEASES" | jq -r '.[] | "\(.package_name) \(.version)"' \
            | while read -r pkg version; do
            if curl -sf -A "198x-ci (steve@stevehill.xyz)" \
                 "https://crates.io/api/v1/crates/$pkg/$version" >/dev/null; then
              echo "$pkg $version already on crates.io — skipping."
            else
              echo "Publishing $pkg $version"
              cargo publish -p "$pkg"
            fi
          done

      # Announce the release in Discord. Every crate released in this run goes
      # into a single message rather than one post per crate: versioning here is
      # per-package, so a normal cycle releases several at once and a post each
      # would bury the channel.
      #
      # Reads DISCORD_RELEASE_WEBHOOK (org-level secret). Absent, the step logs
      # and succeeds — a missing notification must not fail a release that has
      # already published to crates.io.
      - name: Announce the release in Discord
        if: steps.release.outputs.releases_created == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASES: ${{ steps.release.outputs.releases }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::DISCORD_RELEASE_WEBHOOK is not set — nothing posted."
            exit 0
          fi

          count=$(jq 'length' <<<"$RELEASES")
          if [ "$count" = "0" ]; then
            echo "::notice::no releases in this run — nothing posted."
            exit 0
          fi

          # One embed field per crate, each linking to its own GitHub Release.
          # Built with jq throughout so crate names and versions are escaped
          # rather than pasted into a hand-written JSON string.
          jq -n \
            --argjson releases "$RELEASES" \
            --arg repo "$REPO" \
            --arg base "${SERVER_URL}/${REPO}/releases/tag" \
            --arg title "$( [ "$count" = "1" ] && echo "format198x — 1 crate released" || echo "format198x — ${count} crates released" )" \
            '{
               username: "198x releases",
               embeds: [{
                 title: $title,
                 url: ($base + "/" + ($releases[0].tag // ($releases[0].package_name + "-v" + $releases[0].version))),
                 color: 3066993,
                 fields: ($releases | map({
                   name: (.package_name + " v" + .version),
                   value: ("[release notes](" + $base + "/" + (.tag // (.package_name + "-v" + .version)) + ") · [crates.io](https://crates.io/crates/" + .package_name + "/" + .version + ")"),
                   inline: false
                 })),
                 footer: { text: $repo }
               }]
             }' > payload.json

          curl --silent --show-error --fail-with-body \
               --retry 3 --retry-delay 5 --retry-all-errors \
               -H "Content-Type: application/json" \
               -X POST -d @payload.json "$WEBHOOK"

          echo "Announced ${count} crate(s) to Discord."
