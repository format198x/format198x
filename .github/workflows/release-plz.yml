name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_package:
        description: "Publish one already-tagged package to reconcile crates.io"
        required: true
        type: string

# No PAT: the default GITHUB_TOKEN drives everything. Opening the release PR
# needs the org/repo setting "Allow GitHub Actions to create and approve pull
# requests" enabled (Settings -> Actions -> General). id-token is for the OIDC
# publish below — no stored crates.io token.
permissions:
  pull-requests: write
  contents: write
  id-token: write

jobs:
  release:
    name: Publish merged releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Run release-plz (tag and publish merged releases)
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Announce the release in Discord.
      #
      # release-plz reports only package_name, version and tag — no notes. The
      # notes it wrote are in each crate's CHANGELOG.md, committed by the
      # release PR, so main already holds them when this runs. The script reads
      # them there, which gives every crate its own changelog in the
      # announcement rather than a bare list of links.
      #
      # Reads DISCORD_RELEASE_WEBHOOK (this project's channel) and
      # DISCORD_RELEASE_WEBHOOK_ALL (a channel carrying every repo), both
      # optional. With neither set the step logs and succeeds — a missing
      # notification must not fail a release that has already published.
      - name: Announce the release in Discord
        if: steps.release.outputs.releases_created == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
          RELEASES: ${{ steps.release.outputs.releases }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # Built with `if` rather than `[ -n "$x" ] && arr+=(...)`: under
          # `set -e` a failing test at the end of a command list exits the step,
          # so the shorter form would abort whenever a secret is unset.
          targets=()
          if [ -n "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK")
          fi
          # Skip an aggregate pointed at the same channel, so a single-channel
          # setup that fills both secrets does not post twice.
          if [ -n "${WEBHOOK_ALL}" ] && [ "${WEBHOOK_ALL}" != "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK_ALL")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "::notice::no Discord webhook secret set — nothing posted."
            exit 0
          fi

          rm -f payload-*.json
          python3 scripts/discord-release-payloads.py \
            --releases "$RELEASES" \
            --repo "$REPO" \
            --server-url "$SERVER_URL"

          # Every message and every target is attempted even if one fails, so a
          # stale aggregate URL cannot hide a successful post to the project
          # channel, and a rejected message cannot swallow the rest.
          failed=0
          shopt -s nullglob
          for payload in payload-*.json; do
            for target in "${targets[@]}"; do
              if ! curl --silent --show-error --fail-with-body \
                        --retry 3 --retry-delay 5 --retry-all-errors \
                        -H "Content-Type: application/json" \
                        -X POST -d @"$payload" "$target"; then
                failed=1
              fi
            done
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::at least one Discord post failed; see the output above."
            exit 1
          fi

          echo "Announced to ${#targets[@]} Discord channel(s)."

  release-pr:
    name: Prepare the next release
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  reconcile-publish:
    name: Publish an already-tagged package
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the requested package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "${{ inputs.publish_package }}"
