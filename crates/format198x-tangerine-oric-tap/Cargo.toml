# Oric TAP is a decoded byte stream rather than sampled audio: leader bytes,
# a sync marker, a nine-byte ROM header, a name, then address-sized data.
# Emu198x is the first consumer; keeping the codec here prevents that machine
# runtime becoming the owner of a reusable media format.
[package]
name = "format198x-tangerine-oric-tap"
description = "Oric TAP tape images — dependency-free decoding and encoding of headers, names, addresses, and concatenated files."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["oric", "atmos", "tangerine", "tap", "tape"]
categories = ["encoding", "parser-implementations"]

[lints]
workspace = true
