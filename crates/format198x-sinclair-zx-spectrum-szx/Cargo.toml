[package]
name = "format198x-sinclair-zx-spectrum-szx"
description = "ZX Spectrum SZX (ZX-State) snapshots — decoding and encoding of the chunk container and its machine-state chunks, compressed RAM pages included."
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["zx-spectrum", "sinclair", "szx", "snapshot", "retro"]
categories = ["encoding", "parser-implementations"]

[lints]
workspace = true

[dependencies]
# The family's own inflate, for zlib-compressed RAM pages. Path for the
# workspace, version for crates.io; see decisions/shared-deflate-crate.md.
format198x-deflate = { version = "0.1.0", path = "../format198x-deflate" }
