# format198x — the 198x family's retro disk/media format libraries.
#
# A workspace of independent, dependency-free format crates (Amiga ADF today;
# C64 D64, Spectrum TAP, and others as they graduate from build198x modules).
# Each crate is versioned and published to crates.io independently — there is
# no shared workspace version and no binary, so releases stay per-crate and
# uncoupled (see release-plz.toml).
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/format198x/format198x"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
