# release-plz configuration.
#
# On each push to main, release-plz opens (or updates) a per-crate "chore:
# release" PR (version bump + CHANGELOG from conventional-commit prefixes).
# Merging it makes release-plz.yml tag the crate and publish it to crates.io
# over OIDC (in that same workflow run — no PAT, no stored registry token).
#
# Per-package versioning: there is no shared workspace version, so each crate
# bumps independently from its own commits — no lockstep. git_only takes each
# crate's baseline from its <crate>-v<version> git tag, which is deterministic
# and needs no registry token.
[workspace]
# publish = false: release-plz itself does not run cargo publish; the release
# workflow does, over OIDC, gated on a release actually happening. release-plz
# only bumps, changelogs, tags, and cuts GitHub releases.
publish = false
git_only = true
git_release_enable = true
git_tag_enable = true
changelog_update = true
# Package-prefixed tags (<crate>-v<version>) even while there's a single crate:
# it matches the baseline tag and keeps future multi-crate tags unambiguous.
# Without this, a single-crate workspace defaults to the bare `v<version>`,
# which misses the baseline tag and re-releases the published version.
git_tag_name = "{{ package }}-v{{ version }}"
